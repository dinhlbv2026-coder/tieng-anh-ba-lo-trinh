     <div class="kopts ${n===3?"n3":""}">${opts.map((o,j)=>`<button class="kopt ${tm?"txt":""}" data-j="${j}" data-en="${esc(o.en)}">${tm?esc(o.en):em(o.em,84)}</button>`).join("")}</div>`;
    $("#ks").onclick=()=>sayTwice(x.en,0);sayTwice(x.en,300);
    $$(".kopt").forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.j];
      if(o.en===x.en){b.classList.add("ok");if(!tried)good++;kWord(p,x.en,!tried);sfx.ok();$$(".kopt").forEach(z=>z.disabled=true);i++;kTimers.push(setTimeout(step,900))}
      else{tried=true;b.classList.add("no");b.disabled=true;sfx.no();sayTwice(x.en,350)}})};
  step();
}

/* ===== Lớp đồ họa: cây tri thức, đường đi, bạn đồng hành, câu tô màu ===== */
const TSTAGE=[[0,"Hạt giống"],[3,"Nảy mầm"],[15,"Phát triển thân"],[40,"Phân cành"],[80,"Ra lá"],[130,"Kết trái"]];
function kTreeStage(p){const t=kTotal(p);let i=0;TSTAGE.forEach((s,j)=>{if(t>=s[0])i=j});return i}
function kTreeSVG(p){const ts=kTreeStage(p),ps=kStage(p),got=KS().stk[p.id]||[];
  const X=170,G=200;let tree="";
  const crown=(c1,c2)=>`<g class="crown"><circle cx="${X-40}" cy="112" r="32" fill="${c2}"/><circle cx="${X+40}" cy="110" r="34" fill="${c2}"/><circle cx="${X}" cy="92" r="46" fill="${c1}"/><circle cx="${X-22}" cy="76" r="28" fill="${c1}"/><circle cx="${X+24}" cy="74" r="28" fill="${c1}"/><circle cx="${X-12}" cy="70" r="12" fill="#fff" opacity=".18"/>`;
  const trunk=h=>`<path d="M${X-8} ${G} C${X-6} ${G-h*.5} ${X-4} ${G-h*.8} ${X-3} ${G-h} L${X+3} ${G-h} C${X+4} ${G-h*.8} ${X+6} ${G-h*.5} ${X+9} ${G} Z" fill="#92400E"/><path d="M${X-1} ${G-6} L${X-1} ${G-h+8}" stroke="#B45309" stroke-width="2" opacity=".6"/>`;
  if(ts===0)tree=`<ellipse cx="${X}" cy="${G-2}" rx="26" ry="8" fill="#A16207"/><g class="seed"><ellipse cx="${X}" cy="${G-9}" rx="13" ry="8" fill="#7C2D12" transform="rotate(-20 ${X} ${G-9})"/><path d="M${X-6} ${G-12} q6 -4 12 0" stroke="#FDBA74" stroke-width="2" fill="none"/></g>`;
  else if(ts===1)tree=`<ellipse cx="${X}" cy="${G-2}" rx="26" ry="8" fill="#A16207"/><g class="crown"><path d="M${X} ${G-4} C${X} ${G-20} ${X+2} ${G-30} ${X} ${G-40}" stroke="#16A34A" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="${X-14}" cy="${G-42}" rx="15" ry="8" fill="#4ADE80" transform="rotate(-30 ${X-14} ${G-42})"/><ellipse cx="${X+14}" cy="${G-46}" rx="15" ry="8" fill="#22C55E" transform="rotate(30 ${X+14} ${G-46})"/></g>`;
  else if(ts===2)tree=trunk(64)+`<g class="crown"><ellipse cx="${X-18}" cy="${G-66}" rx="20" ry="10" fill="#4ADE80" transform="rotate(-25 ${X-18} ${G-66})"/><ellipse cx="${X+18}" cy="${G-72}" rx="20" ry="10" fill="#22C55E" transform="rotate(25 ${X+18} ${G-72})"/><ellipse cx="${X}" cy="${G-84}" rx="12" ry="18" fill="#16A34A"/></g>`;
  else if(ts===3)tree=trunk(96)+`<g class="crown"><path d="M${X} ${G-62} Q${X-30} ${G-78} ${X-48} ${G-96}" stroke="#92400E" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M${X} ${G-74} Q${X+28} ${G-88} ${X+46} ${G-110}" stroke="#92400E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="${X-50}" cy="${G-100}" r="16" fill="#4ADE80"/><circle cx="${X+48}" cy="${G-114}" r="17" fill="#22C55E"/><circle cx="${X}" cy="${G-106}" r="20" fill="#16A34A"/></g>`;
  else{tree=trunk(110)+crown(ts===5?"#16A34A":"#22C55E",ts===5?"#15803D":"#4ADE80");
    const spots=[[X-34,98],[X+30,92],[X,70],[X-52,122],[X+56,120],[X-12,112],[X+14,58],[X-30,66],[X+44,138],[X-60,104],[X+22,118]];
    tree+=got.map((id,i)=>{const w=KWORLDS.find(x=>x.id===id);const s=spots[i%spots.length];return w?emSvg(w.icon,s[0],s[1],26):""}).join("");
    if(ts===5)tree+=[[X-20,128],[X+40,100],[X+4,104]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="6" fill="#EF4444"/><circle cx="${a-2}" cy="${b-2}" r="2" fill="#fff" opacity=".7"/>`).join("");
    tree+="</g>"}
  const petSize=ps===0?44:[0,48,56,64,72,80][ps];const pet=ps===0?emSvg("🥚",285,G-20,44):emSvg(p.av,285,G-petSize/2+6,petSize)+(PSTAGE[ps][3]?emSvg(PSTAGE[ps][3],285,G-petSize-2,petSize*.45):"");
  return `<svg class="ktree" viewBox="0 0 400 250" role="img" aria-label="Cây tri thức giai đoạn ${TSTAGE[ts][1]}">
   <defs><radialGradient id="kgSun"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/></radialGradient>
   <linearGradient id="kgSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#0284C7"/></linearGradient></defs>
   <circle class="sunglow" cx="336" cy="54" r="52" fill="url(#kgSun)"/><circle cx="336" cy="54" r="22" fill="#FCD34D"/>
   <g class="cl1"><ellipse cx="70" cy="48" rx="34" ry="12" fill="#fff"/><ellipse cx="88" cy="40" rx="20" ry="13" fill="#fff"/><ellipse cx="56" cy="42" rx="14" ry="10" fill="#fff"/></g>
   <g class="cl2"><ellipse cx="250" cy="30" rx="26" ry="9" fill="#fff" opacity=".9"/><ellipse cx="262" cy="24" rx="15" ry="10" fill="#fff" opacity=".9"/></g>
   <path class="bird" d="M120 70 q6 -6 12 0 q6 -6 12 0" stroke="#334155" stroke-width="2" fill="none"/><path class="bird b2" d="M300 96 q5 -5 10 0 q5 -5 10 0" stroke="#334155" stroke-width="2" fill="none"/>
   <rect x="0" y="206" width="400" height="44" fill="url(#kgSea)"/>
   <path class="wave" d="M-40 214 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="#BAE6FD" stroke-width="3" fill="none"/>
   <ellipse cx="200" cy="214" rx="168" ry="26" fill="#FDE68A"/><ellipse cx="200" cy="206" rx="140" ry="20" fill="#4ADE80"/><ellipse cx="190" cy="200" rx="90" ry="9" fill="#86EFAC" opacity=".6"/>
   <g>${tree}</g>${pet}
   <g transform="translate(70 196)"><circle r="7" fill="#F472B6"/><circle r="3" fill="#FDE047"/></g><g transform="translate(330 200)"><circle r="6" fill="#A78BFA"/><circle r="2.5" fill="#FDE047"/></g></svg>`;
}
function kTreeSteps(p){const ts=kTreeStage(p),t=kTotal(p),nx=TSTAGE[ts+1];
  return `<div class="tsteps"><div class="tsh"><b>${em("🌳",28,"inl")} Cây tri thức: ${TSTAGE[ts][1]}</b><span>${nx?`Còn ${nx[0]-t} sao để ${nx[1].toLowerCase()}`:"Cây đã kết trái!"}</span></div>
   <ol>${TSTAGE.map((s,i)=>`<li class="${i<ts?"done":i===ts?"now":""}"><i>${String(i+1).padStart(2,"0")}</i><span>${s[1]}</span></li>`).join("")}</ol></div>`}

/* đường đi nối các điểm */
function kRoad(box,sel,opt){if(!box)return;const old=box.querySelector(":scope>svg.kroad");if(old)old.remove();
  const pts=[...box.querySelectorAll(sel)].map(e=>{const r=e.getBoundingClientRect(),b=box.getBoundingClientRect();return [r.left+r.width/2-b.left,r.top+r.height/2-b.top]});
  if(pts.length<2)return;let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [a,b]=pts[i-1],[c,e]=pts[i],m=(b+e)/2;d+=` C${a} ${m} ${c} ${m} ${c} ${e}`}
  const w=box.scrollWidth,h=box.scrollHeight,ns="http://www.w3.org/2000/svg";const s=document.createElementNS(ns,"svg");s.setAttribute("class","kroad");s.setAttribute("width",w);s.setAttribute("height",h);s.setAttribute("viewBox",`0 0 ${w} ${h}`);
  s.innerHTML=`<path d="${d}" stroke="${opt&&opt.edge||"rgba(255,255,255,.75)"}" stroke-width="26" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${opt&&opt.mid||"#FBBF24"}" stroke-width="6" stroke-dasharray="2 16" fill="none" stroke-linecap="round"/>`;
  box.prepend(s)}
let kRoadFn=null;window.addEventListener("resize",()=>{if(kRoadFn)kRoadFn()});

/* bạn đồng hành trong lúc chơi */
let kCombo=0;
const REACT={ok:[["Great!","Giỏi quá!"],["Yes!","Đúng rồi!"],["Super!","Siêu thế!"],["Good job!","Làm tốt lắm!"],["Wow!","Oa!"]],no:[["Try again!","Thử lại nhé!"],["Oops!","Ối, chưa đúng!"],["You can do it!","Cậu làm được mà!"]]};
function kCoachHTML(p,intro){const ps=kStage(p);return `<div class="kcoach"><span class="kcpet">${ps===0?em("🥚",62):em(p.av,62)}</span><div class="kcb"><b class="en">Let's go!</b><small>${esc(intro)}</small></div><span class="kcombo hidden" id="kcombo"></span></div>`}
function kReact(ok){const c=$(".kcoach");if(!c)return;const pool=REACT[ok?"ok":"no"];const r=pool[Math.floor(Math.random()*pool.length)];
  const b=c.querySelector(".kcb");b.innerHTML=`<b class="en">${r[0]}</b><small>${r[1]}</small>`;
  const pet=c.querySelector(".kcpet");pet.classList.remove("jump","sad");void pet.offsetWidth;pet.classList.add(ok?"jump":"sad");
  kCombo=ok?kCombo+1:0;const cb=$("#kcombo");
  if(cb){if(kCombo>=2){cb.classList.remove("hidden","pop");void cb.offsetWidth;cb.classList.add("pop");cb.textContent=`🔥 x${kCombo}`}else cb.classList.add("hidden")}
  if(ok&&[3,5,8,12].includes(kCombo)){kTone([[784,.1,0],[988,.1,.08],[1175,.1,.16],[1568,.25,.24]]);const z=document.createElement("div");z.className="kburst";z.innerHTML=`<b>Combo x${kCombo}!</b>`;
    const pl=$(".kplay");if(pl){pl.appendChild(z);setTimeout(()=>z.remove(),1300)}}}
(()=>{const o=sfx.ok,n=sfx.no;sfx.ok=()=>{o();kReact(true)};sfx.no=()=>{n();kReact(false)}})();

/* câu có tô màu thành phần (cấp Lá) */
const KPLURAL=new Set(["grapes","noodles","scissors"]);
function kSent(tpl,word){let toks=[];tpl.split(" ").forEach(tk=>{const [t,r]=tk.split("|");if(t.includes("{w}")){const parts=t.replace("{w}",word).split(" ");parts.forEach(x=>toks.push({t:x,r}))}else toks.push({t,r})});
  const pl=KPLURAL.has(word);
  for(let i=0;i<toks.length;i++){const t=toks[i],nx=toks[i+1];
    if(pl){if(t.t==="is")t.t="are";if(t.t==="This")t.t="These";if(t.t==="this")t.t="these";if(t.t==="a"){toks.splice(i,1);i--;continue}}
    if(t.t==="a"&&nx&&/^[aeiou]/i.test(nx.t))t.t="an"}
  return toks}
const ROLEC={S:"#3B82F6",V:"#16A34A",O:"#EC4899"};
const roleChip=(o,cls,j)=>`<${j!=null?"button":"span"} class="${cls} kwt" style="--rc:${ROLEC[o.r]||"#64748B"}" ${j!=null?`data-j="${j}"`:""}>${esc(o.t)}</${j!=null?"button":"span"}>`;
function gSentence(G,nRounds,cb,boss){const rounds=shuffle(G.pool).slice(0,nRounds);let i=0,first=0;
  const step=()=>{if(i>=rounds.length){cb(first,rounds.length);return}
    const x=rounds[i];const toks=kSent(G.w.s[Math.floor(Math.random()*G.w.s.length)],x.en);const sent=toks.map(o=>o.t).join(" ");window.__kAns=sent;
    let src=shuffle(toks.map((o,k)=>({...o,k})));if(src.every((o,k)=>o.k===k))src.reverse();let dst=[],errs=0;
    const draw=()=>{G.el.innerHTML=kBar(G,boss.i+i,boss.n,"Trùm cuối")+`<div class="kq">Xếp thành câu đúng</div><div class="kcenter"><span class="kbig">${em(x.em,110)}</span><button class="ksay" id="ks">🔊</button></div>
      <div class="rlegend"><span style="--rc:${ROLEC.S}">Ai, cái gì</span><span style="--rc:${ROLEC.V}">Làm gì, là</span><span style="--rc:${ROLEC.O}">Bổ sung</span></div>
      <div class="kword sent">${dst.map(o=>roleChip(o,"kslot fill rchip")).join("")||`<span class="kslot kwt muted">…</span>`}</div>
      <div class="ktiles">${src.map((o,j)=>roleChip(o,"ktile rchip",j)).join("")}</div>`;
      $("#ks").onclick=()=>sayTwice(sent,0);
      $$(".ktile").forEach(b=>b.onclick=()=>{const o=src[+b.dataset.j];if(o.t===toks[dst.length].t){dst.push(o);src.splice(+b.dataset.j,1);sfx.flip();
          if(dst.length===toks.length){draw();$$(".ktile").forEach(z=>z.disabled=true);const ok=errs===0;if(ok)first++;kAnswer(G,ok,x);sayEn(sent);i++;kTimers.push(setTimeout(step,1700))}else draw()}
        else{errs++;b.classList.remove("no");void b.offsetWidth;b.classList.add("no");sfx.no();if(errs===1){boss.hit();if(G.hearts<=0)return}}})};
    draw();sayTwice(sent,300)};
  step();
}

/* ===== Âm thanh thu sẵn cho bé (Web Audio): không mất âm đầu, phát 2 lần, không chồng tiếng ===== */
let kSayTok=0,kSfxUntil=0,kSrcs=[],kAudLoading=null;const kBuf=new Map();
function kGetAC(){if(!kAC){try{kAC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}return kAC}
function kUnlock(){try{if(navigator.audioSession&&navigator.audioSession.type!=="playback")navigator.audioSession.type="playback"}catch(e){}const ac=kGetAC();if(!ac)return;if(ac.state!=="running"){try{ac.resume()}catch(e){}}
  try{const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0)}catch(e){}}
["pointerdown","touchend","keydown"].forEach(ev=>document.addEventListener(ev,kUnlock,{passive:true}));
function kAudMap(){if(window.KAUD)return Promise.resolve(window.KAUD);
  if(!kAudLoading)kAudLoading=fetch("kaudio.json").then(r=>r.ok?r.json():{}).then(j=>(window.KAUD=j)).catch(()=>(window.KAUD={}));return kAudLoading}
const kAKey=(lang,t)=>lang+"|"+String(t).trim().toLowerCase();
function kDecode(lang,t){const k=kAKey(lang,t);if(kBuf.has(k))return kBuf.get(k);
  const p=kAudMap().then(m=>{const u=m[k];if(!u)return null;const ac=kGetAC();if(!ac)return null;
    return fetch(u).then(r=>r.arrayBuffer()).then(a=>new Promise((res,rej)=>{const q=ac.decodeAudioData(a,res,rej);if(q&&q.then)q.then(res,rej)}))}).catch(()=>null);
  kBuf.set(k,p);p.then(b=>{if(!b)kBuf.delete(k)});return p}
function kPreload(list){list.forEach(([l,t])=>kDecode(l,t))}
function kStopAudio(){kSayTok++;kSrcs.forEach(s=>{try{s.stop()}catch(e){}});kSrcs=[];try{speechSynthesis.cancel()}catch(e){}}
window.kStopAudio=kStopAudio;
function kTone(seq){const ac=kGetAC();if(!ac)return;try{const t0=ac.currentTime;let end=t0;
  seq.forEach(([f,d,at,type])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t0+at);g.gain.exponentialRampToValueAtTime(.18,t0+at+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+at+d);
    o.connect(g).connect(ac.destination);o.start(t0+at);o.stop(t0+at+d+.05);end=Math.max(end,t0+at+d)});kSfxUntil=Math.max(kSfxUntil,end+.12)}catch(e){}}
/* items: [[lang,text,times],...] phát nối tiếp; trả về khi xong */
async function kSpeak(items,delay){const tok=++kSayTok;kSrcs.forEach(s=>{try{s.stop()}catch(e){}});kSrcs=[];try{speechSynthesis.cancel()}catch(e){}
  items=items.filter(Boolean);const bufs=await Promise.all(items.map(([l,t])=>kDecode(l,t)));if(tok!==kSayTok)return;
  const ac=kGetAC();if(ac&&ac.state!=="running"){try{await ac.resume()}catch(e){}}
  if(!ac||bufs.some(b=>!b)){kFallback(items,tok,delay);return}
  let t=Math.max(ac.currentTime+(delay==null?.15:delay/1000),kSfxUntil);
  items.forEach(([l,txt,times],i)=>{const b=bufs[i];const gap=l==="vi"?.35:(txt.includes(" ")?.75:.6);
    for(let r=0;r<(times||1);r++){const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=1;s.connect(g).connect(ac.destination);s.start(t);kSrcs.push(s);t+=b.duration+(r<(times||1)-1?gap:.25)}});
}
/* dự phòng khi thiếu tệp: giọng máy, chờ nhịp trước khi đọc */
function kFallback(items,tok,delay){if(!("speechSynthesis" in window))return;const q=[];items.forEach(([l,t,n])=>{if(l==="en")for(let r=0;r<(n||1);r++)q.push(t)});
  const next=()=>{if(tok!==kSayTok||!q.length)return;const u=new SpeechSynthesisUtterance(clean(q.shift()));u.lang="en-US";if(voice)u.voice=voice;u.rate=.75;
    u.onend=()=>kTimers.push(setTimeout(next,900));kFbRefs.push(u);if(kFbRefs.length>6)kFbRefs.shift();speechSynthesis.speak(u)};
  kTimers.push(setTimeout(next,Math.max(350,delay||0)))}
const kFbRefs=[];
let kIntro=null;
const KVI={pick:"Nghe rồi chạm đúng hình",memory:"Tìm hai hình giống nhau",spell:"Nghe và chạm đúng quả bóng"};
function sayTwice(t,delay){const it=kIntro;kIntro=null;kSpeak([it?["vi",it,1]:null,["en",t,2]],delay)}
function sayEn(t){kSpeak([["en",t,1]],80)}
function sayVi(t){kSpeak([["vi",t,1]],120)}
function kStartLevel(G){kIntro=null;const words=G.pool.map(x=>["en",x.en]);kPreload(words);
  if(G.t.id==="la"&&G.li===4)kPreload(G.pool.flatMap(x=>G.w.s.map(s=>["en",kSent(s,x.en).map(o=>o.t).join(" ")])));
  const k=KLEVELS[G.li].k;if(G.t.id==="mam"&&KVI[k]){kPreload([["vi",KVI[k]]]);if(k==="memory")kTimers.push(setTimeout(()=>sayVi(KVI[k]),250));else kIntro=KVI[k]}}

route();
if(window.__PWA&&"serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}

</script></body></html>
