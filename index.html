<!DOCTYPE html>
<html lang="vi" data-theme="light"><head><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2672EC"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiếng Anh ba lộ trình</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--sunk:#E8ECF1;--ink:#16202A;--muted:#5A6878;--line:#D3DAE2;
  --m1:#1C6FC4;--m2:#0B7D55;--m3:#6A44D6;--good:#1C7A47;--mid:#B07800;--bad:#B3392B;--focus:#1C6FC4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161D;--surface:#19222C;--sunk:#141C24;--ink:#E5EBF1;--muted:#94A3B3;--line:#2A3846;
  --m1:#5AA6F0;--m2:#3DBB8A;--m3:#A18AF5;--good:#4FC184;--mid:#E3B341;--bad:#EC7B6B;--focus:#5AA6F0;}}
:root[data-theme="dark"]{
  --bg:#10161D;--surface:#19222C;--sunk:#141C24;--ink:#E5EBF1;--muted:#94A3B3;--line:#2A3846;
  --m1:#5AA6F0;--m2:#3DBB8A;--m3:#A18AF5;--good:#4FC184;--mid:#E3B341;--bad:#EC7B6B;--focus:#5AA6F0;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.en{font-family:"Literata",Georgia,"Times New Roman",serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 56px}
.hidden{display:none!important}
h1,h2,h3{line-height:1.2;margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--c,var(--m1));border-color:var(--c,var(--m1));color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;min-height:34px;font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.icon{background:var(--surface);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;display:inline-grid;place-items:center;flex:none;padding:0}
.icon svg{width:19px;height:19px}
.icon.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.back{background:none;border:none;padding:6px 0;color:var(--muted);font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

/* Home */
.hero{padding:10px 0 20px;max-width:62ch}
.hero h1{font-size:clamp(1.8rem,5.5vw,2.7rem);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.hero p{color:var(--muted);margin:0}
.totals{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 22px}
.totals b{display:block;font-size:1.55rem;font-weight:800}
.totals span{color:var(--muted);font-size:.85rem}
.modules{display:grid;gap:14px}
@media(min-width:760px){.modules{grid-template-columns:repeat(3,1fr)}}
.mcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.mcard h2{font-size:1.25rem;font-weight:800}
.mcard .strip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;font-size:1.15rem;line-height:1}
.mcard .strip span{text-align:center;opacity:.28}
.mcard .strip span.on{opacity:1}
.mcard .strip span.part{opacity:.62}
.mfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.lvl{font-weight:800;color:var(--c);font-size:1.05rem}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.settings{margin-top:26px;display:grid;gap:12px}
@media(min-width:760px){.settings{grid-template-columns:1fr 1fr}}

/* Module */
.mhead{display:flex;gap:14px;align-items:center;margin:4px 0 16px}
.mhead .em{font-size:2.6rem;line-height:1}
.mhead h1{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:800}
.mgrid{display:grid;gap:16px}
@media(min-width:1000px){.mgrid{grid-template-columns:1.55fr 1fr;align-items:start}}
.month{margin-bottom:18px}
.month-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.month-head h3{font-size:1rem;font-weight:700}
.month-head .band{font-weight:800;color:var(--c)}
.weeks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.weeks{grid-template-columns:repeat(4,1fr)}}
.wtile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-height:132px}
.wtile .em{font-size:2rem;line-height:1.1}
.wtile .n{font-size:.78rem;color:var(--muted);font-weight:600}
.wtile .tt{font-weight:600;font-size:.92rem;line-height:1.3}
.wtile.pass{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.wtile.now::after{content:"Tuần này";position:absolute;top:10px;right:10px;font-size:.7rem;font-weight:700;background:var(--c);color:#fff;border-radius:6px;padding:1px 6px}
.dots{display:flex;gap:4px;margin-top:auto}
.dots i{width:100%;height:5px;border-radius:3px;background:var(--sunk)}
.ck{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;flex-wrap:wrap}
.scale table{width:100%;border-collapse:collapse;font-size:.9rem}
.scale td,.scale th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scale th{font-weight:700;color:var(--muted);font-size:.82rem}
.chip{display:inline-block;font-size:.75rem;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff}
.radar text{font-size:12px;fill:var(--ink);font-family:inherit}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.78rem}
.week7 div{background:var(--sunk);border-radius:8px;padding:6px 2px}
.week7 b{display:block;font-size:1.1rem}

/* Week */
.whead{display:flex;gap:14px;align-items:center;margin:4px 0 12px}
.whead .em{font-size:2.6rem;line-height:1}
.whead h1{font-size:clamp(1.35rem,4vw,1.9rem);font-weight:800}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4;scrollbar-width:none}
.tab{background:none;border:none;padding:11px 12px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
.tab .sc{font-size:.72rem;font-weight:700;border-radius:5px;padding:0 5px;color:#fff}
.wgrid{display:block}
.wgrid aside{display:none}
.wgrid.show-map aside{display:block}
@media(min-width:1024px){.wgrid{display:grid;grid-template-columns:420px 1fr;gap:22px;align-items:start}.wgrid aside{display:block;position:sticky;top:12px}}
.panel{padding-top:16px;min-width:0}
.map svg{width:100%;height:auto;display:block}
.map .node{cursor:pointer}
.map text{font-family:inherit;fill:var(--ink)}
.detail{margin-top:8px;min-height:84px}
.detail .w{font-size:1.3rem;font-weight:600}
.cards{display:grid;gap:10px}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.wc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.wc .top{display:flex;gap:10px;align-items:center}
.wc .top .e{font-size:1.6rem}
.wc .top .w{font-weight:600;font-size:1.05rem}
.wc .vi{color:var(--c);font-weight:700;font-size:.92rem}
.wc .ex{font-size:.9rem;color:var(--muted)}
.wc.known{border-color:var(--c)}
mark{background:color-mix(in srgb,var(--c) 22%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.passage{font-size:1.08rem;line-height:1.8}
.passage mark{cursor:pointer}
.tip{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:.92rem}

/* Runner */
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--c);transition:width .3s}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.item .ttl{font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.item .prompt{font-size:1.12rem;margin:4px 0 14px}
.opts{display:grid;gap:8px}
@media(min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--bg))}
textarea,.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
.res{margin-top:12px;font-size:.95rem}
.res .score{font-weight:800}
.ok{color:var(--good)} .mid{color:var(--mid)} .no{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:1px dashed var(--line);border-radius:10px;margin-bottom:10px}
.chips button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.chips.src button{background:var(--sunk)}
.done{text-align:center;padding:22px 8px}
.done .big{font-size:3rem;font-weight:800;color:var(--c)}
.used mark{font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;border:1px solid var(--line)}
.msg.ai{background:var(--surface);align-self:flex-start}
.msg.me{background:color-mix(in srgb,var(--c) 14%,var(--surface));align-self:flex-end}
.fb{align-self:flex-end;max-width:88%;font-size:.86rem;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px}
.thinking{color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:92vw;z-index:30}
.sec{margin-top:22px}
.sec>h3{font-size:1.02rem;font-weight:700;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.tabs,.back,.icon,.btn{display:none!important}}

/* ===== v2 visual layer ===== */
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring>span{width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.ring.big{width:86px;height:86px}.ring.big>span{width:68px;height:68px;font-size:1.15rem}
.ladder{display:flex;align-items:flex-end;gap:4px;height:46px}
.ladder i{flex:1;border-radius:6px 6px 2px 2px;background:var(--sunk);display:flex;align-items:flex-end;justify-content:center;font-style:normal;font-size:.62rem;font-weight:700;color:var(--muted);padding-bottom:2px}
.ladder i.on{background:var(--c);color:#fff}
.mcard .band-top{margin:-18px -18px 4px;padding:16px 18px;border-radius:10px 10px 0 0;background:color-mix(in srgb,var(--c) 13%,var(--surface));display:flex;gap:14px;align-items:center}
.mcard .band-top .big-em{font-size:2.6rem;line-height:1}
.mcard{border-top-width:0}
.quick{display:flex;gap:8px;flex-wrap:wrap}
/* roadmap path */
.path{position:relative;padding:6px 0 4px}
.path::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:color-mix(in srgb,var(--c) 35%,var(--line));border-radius:2px}
.mpill{position:relative;margin:18px auto 10px;width:fit-content;max-width:94%;background:var(--c);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;text-align:center;font-size:.92rem;z-index:1}
.mpill small{display:block;font-weight:500;opacity:.9;font-size:.75rem}
.stn{position:relative;display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:8px;margin:8px 0;background:none;border:none;width:100%;padding:0;text-align:left}
.stn .bub{grid-column:2;grid-row:1;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;z-index:1}
.stn .bub>span{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:1.75rem}
.stn.pass .bub>span{background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.stn.now .bub{outline:3px solid var(--c);outline-offset:3px}
.stn .crd{grid-row:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.stn.L .crd{grid-column:1;text-align:right}.stn.R .crd{grid-column:3}
.stn .crd .n{font-size:.72rem;font-weight:700;color:var(--c)}
.stn .crd .tt{font-weight:600;font-size:.88rem;line-height:1.3}
.stn .crd .ss{font-size:.72rem;color:var(--muted)}
.flag{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px auto 6px;text-align:center}
.flag .fl{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:var(--surface);border:2px dashed var(--c)}
.flag.ok .fl{background:var(--c);border-style:solid}
/* week header */
.wband{background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:18px;padding:16px;margin:4px 0 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wband .em{font-size:3rem;line-height:1}
.wband .info{flex:1;min-width:200px}
.wband h1{font-size:clamp(1.3rem,4vw,1.85rem);font-weight:800}
.skills{display:flex;gap:10px}
.skl{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:0;font-size:.72rem;font-weight:600;color:var(--muted)}
.skl .ring{width:50px;height:50px}.skl .ring>span{width:40px;height:40px;font-size:1.05rem}
.tab .ti{font-size:1.05rem}
/* vocab */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vt{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-height:128px}
.vt .e{font-size:2rem;line-height:1.2}
.vt .w{font-weight:600;font-size:.95rem;line-height:1.25}
.vt .v{font-size:.8rem;color:var(--c);font-weight:600}
.vt.known{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.vt .tag{position:absolute;top:6px;left:8px;font-size:.62rem;font-weight:700;color:var(--muted)}
.vt .ck{position:absolute;top:2px;right:2px;margin:0;padding:4px;border:none;background:none;font-size:1rem;line-height:1;min-width:32px;min-height:32px}
.fc{perspective:1200px;max-width:520px;margin:0 auto}
.fc-in{position:relative;height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.face .e{font-size:4.2rem;line-height:1}
.face .w{font-size:clamp(1.4rem,6vw,2rem);font-weight:600}
.face .v{font-size:1.25rem;font-weight:700;color:var(--c)}
.face .x{font-size:1rem}
.fc-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.vbook .wk{margin-bottom:18px}
.vbook .wk h3{font-size:.95rem;margin-bottom:8px;display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}}

/* ===== v3: bright, fresh, 3D ===== */
:root,:root[data-theme="light"]{
  --bg:#F5F9FF;--surface:#FFFFFF;--sunk:#E9F0F8;--ink:#13213B;--muted:#5A6A82;--line:#E1E8F1;
  --m1:#2672EC;--m2:#0A8A5F;--m3:#7350F2;--good:#15803D;--mid:#C26A04;--bad:#D92D20;--focus:#2672EC;
  --shadow:0 1px 2px rgba(19,33,59,.05),0 10px 28px rgba(38,90,180,.09);
}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25)}
html{background:var(--bg)}
body{background:
  radial-gradient(900px 520px at -8% -12%,#D6ECFF 0%,transparent 62%),
  radial-gradient(760px 460px at 108% 2%,#D8F7E8 0%,transparent 58%),
  radial-gradient(900px 640px at 50% 118%,#ECE4FF 0%,transparent 62%),var(--bg);background-attachment:fixed}
:root[data-theme="dark"] body{background:var(--bg)}
.e3d{display:inline-block;vertical-align:middle;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(19,33,59,.18));-webkit-user-drag:none;user-select:none}
.e3d.inl{width:28px;height:28px;filter:none}
.e3t{display:inline-block;line-height:1}
.box,.mcard,.item,.wc,.vt,.stn .crd,.face,.week7 div,.opt,.wtile{border-color:var(--line);box-shadow:var(--shadow)}
.box,.mcard,.item{border-radius:20px}
.btn{border-radius:12px;box-shadow:0 1px 2px rgba(19,33,59,.06)}
.btn.primary{background:linear-gradient(135deg,var(--c,var(--m1)),color-mix(in srgb,var(--c,var(--m1)) 78%,#000 0%));box-shadow:0 6px 16px color-mix(in srgb,var(--c,var(--m1)) 35%,transparent)}
.icon{box-shadow:0 2px 8px rgba(19,33,59,.08);border-color:transparent}
/* hero */
.hero2{display:grid;gap:10px;align-items:center;padding:6px 0 18px}
@media(min-width:760px){.hero2{grid-template-columns:1.4fr 1fr}}
.hero2 h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.025em;line-height:1.08;margin-bottom:10px}
.hero2 p{color:var(--muted);margin:0 0 16px;max-width:56ch}
.hero2 .totals{margin:0;gap:12px}
.tot{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.tot b{font-size:1.3rem}
.hero-art{position:relative;height:190px;display:flex;justify-content:center;align-items:center}
.hero-art span{position:absolute}
.hero-art .fl0{left:12%;top:22%}.hero-art .fl1{left:40%;top:0}.hero-art .fl2{right:10%;top:32%}
.hero-art .e3d{width:104px;height:104px;filter:drop-shadow(0 14px 14px rgba(19,33,59,.22))}
.hero-art::before{content:"";position:absolute;inset:18% 10% 4%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0))}

 q:[["An emergency fund often covers three to six months of expenses.",true],["You should save money only after spending.",false]],
 x:"Viết 5 câu mô tả cách anh quản lý ngân sách gia đình hằng tháng."},
{t:"Tài khoản và ngân hàng số",e:"Bank accounts and digital banking",i:"🏦",
 w:[["current account","tài khoản thanh toán","🏦"],["savings account","tài khoản tiết kiệm","💰"],["mobile banking","ngân hàng trên điện thoại","📱"],["balance","số dư","🔢"],["transfer","chuyển khoản","🔁"],["transaction","giao dịch","🔄"],["statement","sao kê","📃"],["OTP","mã xác thực một lần","🔐"]],
 p:"Most customers open a current account to receive their salary and pay bills. Money in a current account earns little or no interest, so many people also open a savings account. With mobile banking, you can check your balance, make a transfer and pay bills at any time. Every transaction appears on your monthly statement. To protect customers, banks send an OTP, a one-time password, to confirm important payments. Remember that bank staff should never ask for your OTP. If someone does, it is probably a scam.",
 q:[["Bank staff may ask for your OTP by phone.",false],["You can make a transfer with mobile banking.",true]],
 x:"Viết 4–5 câu hướng dẫn một khách hàng lớn tuổi dùng ứng dụng ngân hàng an toàn."},
{t:"Tiết kiệm và lãi suất",e:"Saving and interest",i:"📈",
 w:[["term deposit","tiền gửi có kỳ hạn","⏳"],["interest rate","lãi suất","📈"],["maturity","ngày đáo hạn","🎯"],["withdraw","rút tiền","📤"],["compound interest","lãi kép","❄️"],["deposit","khoản tiền gửi","📥"],["inflation","lạm phát","🎈"],["real return","lợi suất thực","🔍"]],
 p:"When you put money in a term deposit, the bank pays you interest at a fixed interest rate until maturity. If you withdraw the money early, you may receive a lower rate. Over many years, compound interest makes a big difference: you earn interest not only on your deposit but also on the interest you have already received. However, savers should also think about inflation. If your deposit earns five percent a year but prices rise by four percent, your real return is only about one percent.",
 q:[["Withdrawing early usually gives you a higher rate.",false],["Real return takes inflation into account.",true]],
 x:"Viết 5 câu giải thích cho khách hàng sự khác nhau giữa lãi suất danh nghĩa và lợi suất thực."},
{t:"Tín dụng và khoản vay",e:"Loans and credit",i:"💳",
 w:[["lender","bên cho vay","🏛️"],["borrower","bên vay","🙋"],["collateral","tài sản bảo đảm","🏠"],["credit score","điểm tín dụng","⭐"],["disbursement","giải ngân","💸"],["instalment","kỳ trả góp","🗓️"],["principal","nợ gốc","🧱"],["overdue","quá hạn","🚨"]],
 p:"A loan is an agreement between a lender and a borrower. For a large loan, such as a home loan, the bank usually asks for collateral, for example a house or land. The bank also checks the borrower's credit score and income. After the contract is signed, the bank makes the disbursement. Each month, the borrower pays an instalment, which includes part of the principal and the interest. If a payment is overdue, the borrower may pay a penalty, and the late payment can affect future loan applications.",
 q:[["Each instalment includes principal and interest.",true],["Disbursement happens before the contract is signed.",false]],

{t:"Nền tảng bảo hiểm nhân thọ",e:"Life insurance basics",i:"🛡️",
 w:[["policy","hợp đồng bảo hiểm","📄"],["policyholder","bên mua bảo hiểm","🖊️"],["premium","phí bảo hiểm","💳"],["the insured","người được bảo hiểm","🧍"],["policy term","thời hạn hợp đồng","📆"],["sum assured","số tiền bảo hiểm","🛡️"],["beneficiary","người thụ hưởng","🎁"],["rider","sản phẩm bổ trợ","➕"]],
 p:"A life insurance contract is called a policy. The policyholder signs the contract and pays the premium. The insured is the person whose life and health are covered; often this is the policyholder, but it can be a child or a spouse. If the insured dies during the policy term, the insurer pays the sum assured to the beneficiary. Customers can add a rider, such as hospital or critical illness benefits, to increase their coverage. Many advisors believe that choosing the right sum assured is more important than choosing the cheapest premium.",
 q:[["The beneficiary always pays the premium.",false],["A rider can increase coverage.",true]],
 x:"Viết 5 câu giải thích vai trò của bên mua bảo hiểm, người được bảo hiểm và người thụ hưởng."},
{t:"Phân tích nhu cầu tài chính",e:"Financial needs analysis",i:"🧭",
 w:[["fact-finding","khai thác thông tin","🔎"],["dependants","người phụ thuộc","🧒"],["financial goals","mục tiêu tài chính","🎯"],["education fund","quỹ học vấn","🎓"],["retirement","nghỉ hưu","🏖️"],["income replacement","thay thế thu nhập","🧯"],["protection gap","khoảng trống bảo vệ","🕳️"],["affordable","vừa khả năng chi trả","✅"]],
 p:"Good advisors start with fact-finding, not with a product. They ask about the customer's dependants, income, debts and financial goals. A common goal is an education fund for the children; another is a comfortable retirement. The advisor then estimates how much money the family would need if the main earner could no longer work. This is the income replacement need. The difference between this need and the customer's existing savings and insurance is called the protection gap. Finally, the advisor recommends a plan that is affordable over the long term.",
 q:[["The protection gap is the family's total income.",false],["Good advisors start with fact-finding.",true]],
 x:"Viết 5 câu hỏi khai thác nhu cầu (bằng tiếng Anh) anh sẽ hỏi một khách hàng mới."},
{t:"Trình bày và xử lý từ chối",e:"Presenting and handling objections",i:"🤝",
 w:[["objection","lời từ chối, phản đối","🙅"],["think it over","suy nghĩ thêm","🤔"],["acknowledge","ghi nhận","👂"],["concern","mối băn khoăn","😟"],["trust","niềm tin","🫱"],["benefit illustration","bảng minh họa quyền lợi","📑"],["value","giá trị","💎"],["follow-up","buổi liên hệ lại","📞"]],
 p:"Customers often raise an objection such as “It's too expensive” or “I need to think it over.” A professional advisor does not argue. First, acknowledge the customer's concern: “I understand why you feel that way.” Then ask a question to find the real reason. Sometimes the issue is price; sometimes it is a lack of trust in insurance. The advisor can use a benefit illustration to show what the family receives and when. Focus on value, not only on cost. Finally, respect the decision and agree on a clear follow-up date.",
 q:[["Advisors should argue strongly with customers.",false],["A benefit illustration shows what the family receives.",true]],
 x:"Viết đoạn phản hồi 4–5 câu khi khách nói: “Tôi thấy gửi tiết kiệm ngân hàng an toàn hơn.”"},
{t:"Hậu mãi và giải quyết quyền lợi",e:"Claims and after-sales service",i:"📨",
 w:[["after-sales","hậu mãi","🧰"],["claim","yêu cầu giải quyết quyền lợi","📨"],["supporting documents","chứng từ kèm theo","📎"],["free-look period","thời gian cân nhắc","👀"],["grace period","thời gian gia hạn đóng phí","⏳"],["lapse","mất hiệu lực","🥀"],["reinstatement","khôi phục hiệu lực","🔄"],["surrender value","giá trị hoàn lại","💱"]],
 p:"Good after-sales service builds long-term trust. When a customer is in hospital, the advisor helps them submit a claim with the supporting documents, such as discharge papers and invoices. New customers should know about the free-look period, a short time after receiving the policy when they can cancel under the policy terms. If a premium is late, there is usually a grace period. If the premium is still unpaid after that, the policy may lapse. The customer can often apply for reinstatement. Cancelling early is costly, because the surrender value is usually low in the first years.",
 q:[["The surrender value is usually high in the first years.",false],["A lapsed policy can often be reinstated.",true]],
 x:"Viết email 5 câu hướng dẫn khách hàng nộp hồ sơ yêu cầu chi trả quyền lợi nằm viện."},
{t:"Đầu tư và rủi ro",e:"Investment and risk",i:"📊",
 w:[["portfolio","danh mục đầu tư","🧺"],["bond","trái phiếu","📜"],["stocks","cổ phiếu","📊"],["return","lợi nhuận, suất sinh lời","📈"],["volatility","mức biến động","🎢"],["liquidity","tính thanh khoản","💧"],["diversification","đa dạng hóa","🧩"],["risk tolerance","mức chấp nhận rủi ro","🎚️"]],
 p:"An investment portfolio may include cash, bonds, stocks and real estate. Each asset has a different level of return, risk and liquidity. Stocks may offer higher long-term returns, but their prices often show high volatility. A government bond is usually less risky, but its return is lower. Cash has the highest liquidity, which means you can use it quickly. Diversification means spreading money across different assets so that a loss in one area does not destroy the whole portfolio. Before investing, an advisor should assess the client's risk tolerance and time horizon.",
 q:[["Cash has the highest liquidity.",true],["Diversification means putting all your money in one stock.",false]],
 x:"Viết 5 câu tư vấn cho một người 30 tuổi muốn đầu tư lần đầu."},
{t:"Báo cáo tài chính",e:"Financial statements",i:"🧾",
 w:[["income statement","báo cáo kết quả kinh doanh","🧾"],["revenue","doanh thu","💹"],["net profit","lợi nhuận ròng","🏁"],["balance sheet","bảng cân đối kế toán","⚖️"],["assets","tài sản","🏗️"],["liabilities","nợ phải trả","⛓️"],["equity","vốn chủ sở hữu","🧱"],["cash flow","dòng tiền","🔄"]],
 p:"Companies report their performance in three main financial statements. The income statement shows revenue, expenses and net profit over a period, such as a year. The balance sheet shows what the company owns and owes at one point in time. On the balance sheet, assets must equal liabilities plus equity. The cash flow statement shows how cash moves in and out through operating, investing and financing activities. A company can report a profit but still have problems if its cash flow is weak.",
 q:[["Assets equal liabilities plus equity.",true],["The balance sheet shows revenue over a whole year.",false]],
 x:"Viết 5 câu mô tả tình hình tài chính của một doanh nghiệp giả định dựa trên ba báo cáo."},
{t:"Chỉ số ngân hàng và bảo hiểm",e:"Key ratios for banks and insurers",i:"📐",
 w:[["ratio","tỷ số, chỉ số","➗"],["ROA","tỷ suất sinh lời trên tài sản","📐"],["ROE","tỷ suất sinh lời trên vốn chủ sở hữu","📏"],["net interest margin","biên lãi ròng (NIM)","↕️"],["non-performing loan","nợ xấu","🚩"],["capital adequacy ratio","hệ số an toàn vốn (CAR)","🛡️"],["loss ratio","tỷ lệ bồi thường","📉"],["persistency","tỷ lệ duy trì hợp đồng","🔗"]],
 p:"Analysts use a ratio to compare one financial institution with another. ROA, or return on assets, equals net profit divided by total assets. ROE, or return on equity, equals net profit divided by shareholders' equity. For banks, the net interest margin compares net interest income with earning assets. The non-performing loan ratio shows the share of bad loans in total loans and reflects asset quality. The capital adequacy ratio compares a bank's capital with its risk-weighted assets. For insurers, the loss ratio compares claims with premiums, while persistency shows the percentage of policies that remain in force after a period, such as thirteen months.",
 q:[["ROE equals net profit divided by total assets.",false],["Persistency shows how many policies remain in force.",true]],
 x:"Viết 5 câu nhận xét tình huống giả định: ROA của một ngân hàng tăng nhưng tỷ lệ nợ xấu cũng tăng."},
{t:"Quy định, tuân thủ, đạo đức",e:"Regulation, compliance and ethics",i:"⚖️",
 w:[["regulation","quy định pháp lý","📜"],["compliance","tuân thủ","✅"],["disclosure","công bố thông tin","📢"],["mis-selling","bán sai nhu cầu","🚫"],["suitability","sự phù hợp","🧷"],["conflict of interest","xung đột lợi ích","⚔️"],["confidentiality","bảo mật","🤐"],["anti-money laundering","phòng chống rửa tiền","🧼"]],
 p:"Financial services are strictly controlled by regulation, so every company has a compliance team. Advisors must follow rules on disclosure: customers should clearly understand the fees, risks and benefits before they sign. Selling a product that does not match the customer's needs is called mis-selling, and it damages trust in the whole industry. Suitability means the product fits the customer's goals, budget and risk profile. Staff must also avoid any conflict of interest and protect the confidentiality of customer data. Under anti-money laundering rules, unusual transactions must be checked and reported.",
 q:[["Mis-selling means selling a product that fits the customer's needs.",false],["Customers should understand the fees before they sign.",true]],
 x:"Viết 5 câu về một tình huống tư vấn có thể gây xung đột lợi ích và cách anh xử lý."}

{t:"Quy trình nghiên cứu",e:"The research process",i:"🔬",
 w:[["research problem","vấn đề nghiên cứu","❗"],["objective","mục tiêu","🎯"],["methodology","phương pháp luận","🛠️"],["sample","mẫu","🫙"],["data collection","thu thập dữ liệu","📥"],["analysis","phân tích","🧮"],["findings","kết quả nghiên cứu","💡"],["contribution","đóng góp","🏅"]],
 p:"Scientific research follows a clear process. It starts with a research problem, an issue that is important but not yet well explained. The researcher then sets an objective, for example to examine how digital services affect customer satisfaction in banking. Next comes the methodology: the design, the sample and the methods. After data collection, the researcher performs the analysis, often with statistical software. The findings are compared with previous studies. Finally, the researcher explains the contribution of the study to theory and practice.",

{t:"Tổng quan tài liệu và trích dẫn",e:"Literature review and citation",i:"📚",
 w:[["literature review","tổng quan tài liệu","📚"],["synthesize","tổng hợp","🧵"],["research gap","khoảng trống nghiên cứu","🕳️"],["peer-reviewed","được bình duyệt","🧐"],["journal","tạp chí khoa học","📰"],["citation","trích dẫn","🔗"],["reference list","danh mục tài liệu tham khảo","📇"],["plagiarism","đạo văn","🚫"]],
 p:"A literature review is more than a summary of papers. The researcher must synthesize previous studies, compare their results and identify a research gap. Good sources are peer-reviewed articles published in a recognized journal. Each idea taken from another author needs a citation in the text and a full entry in the reference list. Common styles include APA and Harvard. Copying other people's words or ideas without citation is plagiarism, which is a serious academic offense. Reference managers such as Zotero or Mendeley help researchers organize their sources.",
 q:[["Plagiarism is acceptable if the source is old.",false],["A literature review should identify a research gap.",true]],
 x:"Viết 5 câu tóm tắt bằng lời của anh một bài báo tài chính đã đọc, có trích dẫn tác giả và năm."},
{t:"Câu hỏi nghiên cứu và giả thuyết",e:"Research questions and hypotheses",i:"❓",
 w:[["research question","câu hỏi nghiên cứu","❓"],["hypothesis","giả thuyết","🔮"],["positive relationship","quan hệ cùng chiều","➕"],["negative relationship","quan hệ ngược chiều","➖"],["test","kiểm định","🧪"],["null hypothesis","giả thuyết không (H0)","0️⃣"],["reject","bác bỏ","❌"],["support","ủng hộ (kết quả)","✔️"]],
 p:"A research question asks what the study wants to know, for example: “Does bank size affect profitability?” A hypothesis is a clear statement that answers the question in advance, such as: “Bank size has a positive relationship with ROA.” Some hypotheses predict a negative relationship, for instance between credit risk and profitability. The researcher then needs data to test each statement. In statistics, the null hypothesis states that there is no effect. After the analysis, the researcher may reject the null hypothesis if the evidence is strong. Researchers usually say that the results support a hypothesis, not that they prove it.",
 q:[["The null hypothesis states that there is no effect.",true],["Researchers usually say their results prove a hypothesis.",false]],
 x:"Viết một câu hỏi nghiên cứu và hai giả thuyết về quan hệ giữa chuyển đổi số và lợi nhuận ngân hàng."},
{t:"Biến số và mô hình",e:"Variables and models",i:"🧩",
 w:[["dependent variable","biến phụ thuộc","🎯"],["independent variable","biến độc lập","🎛️"],["control variable","biến kiểm soát","🧷"],["proxy","biến đại diện","🪪"],["construct","khái niệm nghiên cứu","🧩"],["mediator","biến trung gian","🌉"],["moderator","biến điều tiết","🔧"],["conceptual framework","khung khái niệm, mô hình","🗺️"]],
 p:"In a quantitative model, the dependent variable is the outcome the researcher wants to explain, such as bank profitability. An independent variable is a factor that may influence it, such as bank size or digital investment. A control variable is included to reduce bias, for example inflation or GDP growth. When an idea cannot be measured directly, researchers use a proxy, such as ROA for profitability. In survey research, each abstract concept is called a construct. A mediator explains how an effect happens, while a moderator changes the strength of the effect. All of these relationships are shown in the conceptual framework.",
 q:[["ROA can be used as a proxy for profitability.",true],["A moderator explains how an effect happens.",false]],
 x:"Viết 5 câu mô tả một mô hình nghiên cứu: biến phụ thuộc, biến độc lập, biến kiểm soát."},
{t:"Chọn mẫu và thu thập dữ liệu",e:"Sampling and data collection",i:"🎯",
 w:[["population","tổng thể","👥"],["random sampling","chọn mẫu ngẫu nhiên","🎲"],["convenience sampling","chọn mẫu thuận tiện","🚪"],["biased","bị thiên lệch","↘️"],["sample size","cỡ mẫu","🔢"],["questionnaire","bảng câu hỏi","📋"],["response rate","tỷ lệ phản hồi","📬"],["secondary data","dữ liệu thứ cấp","🗄️"]],
 p:"The population is the whole group the researcher wants to study, for example all individual customers of commercial banks in a region. Because it is impossible to survey everyone, the researcher selects a sample. With random sampling, every member has an equal chance to be selected, which supports generalization. Convenience sampling is faster and cheaper, but the results may be biased. The sample size depends on the number of variables and the analysis method. Primary data are often collected with a questionnaire, and the response rate should be reported. Many finance studies instead use secondary data from annual reports or databases.",
 q:[["Convenience sampling always avoids bias.",false],["Secondary data can come from annual reports.",true]],
 x:"Viết 5 câu mô tả cách anh sẽ chọn mẫu và thu thập dữ liệu cho một khảo sát khách hàng ngân hàng."},
{t:"Đo lường: thang đo, độ tin cậy, giá trị",e:"Measurement: scales, reliability, validity",i:"📏",
 w:[["item","biến quan sát","🔘"],["Likert scale","thang đo Likert","📶"],["reliability","độ tin cậy","🧱"],["Cronbach's alpha","hệ số Cronbach's alpha","🅰️"],["validity","giá trị (tính hợp lệ)","✅"],["convergent validity","giá trị hội tụ","🔽"],["discriminant validity","giá trị phân biệt","↔️"],["pilot test","khảo sát thử","🧪"]],
 p:"Each survey construct is usually measured with more than one item on a Likert scale, for example from 1 (strongly disagree) to 5 (strongly agree). Reliability means the items measure a construct consistently. A common indicator is Cronbach's alpha; values above 0.7 are generally considered acceptable. Validity means the items measure what they are supposed to measure. Convergent validity shows that items of the same construct are strongly related, while discriminant validity shows that different constructs are truly distinct. Before the main survey, a pilot test with a small group helps researchers improve unclear questions.",
 q:[["A Cronbach's alpha above 0.7 is generally acceptable.",true],["Discriminant validity shows that different constructs are the same.",false]],
 x:"Viết 3–4 câu hỏi khảo sát theo thang Likert để đo “niềm tin vào ngân hàng số”."},
{t:"Thống kê mô tả",e:"Descriptive statistics",i:"📊",
 w:[["mean","giá trị trung bình","⚖️"],["median","trung vị","🎚️"],["standard deviation","độ lệch chuẩn","〰️"],["minimum","giá trị nhỏ nhất","⬇️"],["maximum","giá trị lớn nhất","⬆️"],["outlier","giá trị ngoại lai","🦄"],["skewness","độ lệch phân phối","↗️"],["percentage","tỷ lệ phần trăm","💯"]],
 p:"Descriptive statistics summarize the data before testing hypotheses. The mean is the average value, while the median is the middle value when data are sorted. When there are extreme values, the median is often more informative than the mean. The standard deviation shows how widely values spread around the mean. Researchers also report the minimum and maximum of each variable. An outlier is an observation that is very different from the others; it may be an error or a real but unusual case. Skewness describes whether the distribution is symmetric. For categorical data such as gender, a percentage is more useful.",
 q:[["The median is the middle value of sorted data.",true],["An outlier is always a data error.",false]],
 x:"Viết 5 câu mô tả bảng thống kê giả định: ROA trung bình 1,2%, độ lệch chuẩn 0,8%, nhỏ nhất −0,5%, lớn nhất 3,1%."},
{t:"Hồi quy và mức ý nghĩa",e:"Regression and significance",i:"📉",
 w:[["regression","hồi quy","📉"],["coefficient","hệ số","🔢"],["standard error","sai số chuẩn","🎯"],["p-value","giá trị p","🅿️"],["statistically significant","có ý nghĩa thống kê","⭐"],["R-squared","hệ số xác định R²","🟦"],["correlation","tương quan","🪢"],["causation","quan hệ nhân quả","➡️"]],
 p:"Regression analysis estimates how independent variables affect a dependent variable. Each coefficient shows the expected change in the dependent variable when one independent variable increases by one unit, holding the others constant. The standard error measures the precision of the coefficient. The p-value is the probability of observing a result at least as extreme as this one if the null hypothesis were true. When the p-value is below 0.05, the effect is usually called statistically significant at the 5% level. R-squared shows the proportion of variation explained by the model. Remember that correlation does not prove causation.",
 q:[["A p-value below 0.05 is usually called significant at the 5% level.",true],["Correlation always proves causation.",false]],
 x:"Viết 4–5 câu diễn giải kết quả hồi quy giả định: hệ số quy mô ngân hàng = 0,35; p = 0,01; R² = 0,42."},
{t:"Chỉ số tài chính trong nghiên cứu",e:"Financial measures in research",i:"🏛️",
 w:[["profitability","khả năng sinh lời","💰"],["asset quality","chất lượng tài sản","🩺"],["liquidity","thanh khoản","💧"],["leverage","đòn bẩy tài chính","🏋️"],["firm size","quy mô doanh nghiệp","🏢"],["market value","giá trị thị trường","🏷️"],["earnings per share","lợi nhuận trên mỗi cổ phiếu (EPS)","🧮"],["dividend yield","tỷ suất cổ tức","🌾"]],
 p:"Finance research often measures profitability with ROA, ROE or net interest margin. Asset quality in banking is usually measured with the non-performing loan ratio or loan loss provisions. Liquidity can be measured as liquid assets over total assets, while leverage is often measured as total debt over total assets or over equity. Firm size is commonly the natural logarithm of total assets. For listed companies, researchers also study market value, earnings per share and dividend yield. Researchers should always define each measure clearly, because different studies may use different formulas.",
 q:[["Firm size is often measured as the logarithm of total assets.",true],["All studies use the same formula for leverage.",false]],
 x:"Viết 5 câu định nghĩa cách đo ba biến tài chính anh sẽ dùng trong một nghiên cứu."},
{t:"Dữ liệu bảng và kiểm định độ vững",e:"Panel data and robustness",i:"🧪",
 w:[["panel data","dữ liệu bảng","🗂️"],["fixed effects","mô hình tác động cố định","📌"],["random effects","mô hình tác động ngẫu nhiên","🎲"],["Hausman test","kiểm định Hausman","⚗️"],["multicollinearity","đa cộng tuyến","🕸️"],["endogeneity","nội sinh","🔄"],["lagged variable","biến trễ","⏮️"],["robustness check","kiểm định độ vững","🛡️"]],
 p:"Many banking studies use panel data, which follow the same banks over several years. Two common models are fixed effects and random effects. The Hausman test helps researchers choose between them. Before estimation, researchers check multicollinearity, which occurs when independent variables are highly correlated with each other. A serious concern is endogeneity, when an explanatory variable is correlated with the error term, for example because of reverse causality. Methods such as GMM, often using a lagged variable as an instrument, can help address this problem. Finally, a robustness check, such as using another proxy or a sub-sample, shows whether the main results remain stable.",
 q:[["The Hausman test helps choose between fixed and random effects.",true],["Multicollinearity means the sample is too large.",false]],
 x:"Viết 4–5 câu giải thích cho hội đồng vì sao nghiên cứu dùng GMM và kiểm định độ vững."},
{t:"Cấu trúc bài báo và abstract",e:"Paper structure and abstract",i:"✍️",
 w:[["introduction","phần mở đầu","🚪"],["results","kết quả","📊"],["discussion","phần thảo luận","💬"],["conclusion","kết luận","🏁"],["abstract","tóm tắt","📝"],["implications","hàm ý","💡"],["limitation","hạn chế","🚧"],["keywords","từ khóa","🔑"]],
 p:"Most empirical papers follow the IMRaD structure: introduction, methods, results and discussion, followed by a conclusion. The abstract, often 150 to 250 words, summarizes the purpose, method, main findings and implications. The introduction explains the problem and the research gap. The results section reports what was found without interpretation, while the discussion explains what the results mean and compares them with earlier studies. Authors should state each limitation honestly and suggest future research. Finally, they choose four to six keywords so that other researchers can find the paper.",
 q:[["The discussion compares the results with earlier studies.",true],["Limitations should be hidden from readers.",false]],
 x:"Viết abstract 5–6 câu cho một nghiên cứu giả định về tác động của ngân hàng số đến lợi nhuận ngân hàng."},
{t:"Bình duyệt, hội thảo, thư học thuật",e:"Peer review, conferences and emails",i:"🎤",
 w:[["submission","bài nộp","📤"],["reviewer","người phản biện","🧐"],["accepted","được chấp nhận","🎉"],["rejected","bị từ chối","📭"],["revise and resubmit","chỉnh sửa và nộp lại","🔁"],["presentation","bài trình bày","🎤"],["Q&A session","phiên hỏi đáp","🙋"],["Dear Professor","Kính gửi Giáo sư","✉️"]],
 p:"After a submission, the journal editor checks whether the paper fits the journal. If it does, the paper is sent to at least one reviewer, often two or three. The decision may be accepted, rejected, or revise and resubmit. When you revise, reply to every comment politely in a response letter. At a conference, you will give a short presentation, followed by a Q&A session. If a question is difficult, you can say, “Thank you, that's a very good point. I will consider it in my future work.” When writing to a scholar, begin with “Dear Professor” and keep your email short and clear.",
 q:[["A revise and resubmit decision means the paper is rejected forever.",false],["Authors should reply to every reviewer comment.",true]],
 x:"Viết email 5–6 câu gửi một giáo sư xin góp ý cho bản thảo bài báo."}

    while((m=r.exec(text))){const s=m.index+m[1].length,e=s+m[2].length;if(!marks.some(k=>s<k[1]&&e>k[0]))marks.push([s,e,w]);if(r.lastIndex===m.index)r.lastIndex++}});
  marks.sort((a,b)=>a[0]-b[0]);let out="",p=0;
  marks.forEach(([s,e,w])=>{out+=esc(text.slice(p,s))+`<mark data-w="${esc(w)}">${esc(text.slice(s,e))}</mark>`;p=e});
  return out+esc(text.slice(p));
}

function radar(vals){

  const pt=(k,v)=>[cx+ax[k][0]*R*v/100,cy+ax[k][1]*R*v/100];
  const rings=[25,50,70,85,100].map(v=>`<polygon points="${ax.map((_,k)=>pt(k,v).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="${v===70?1.6:1}" ${v===70?'stroke-dasharray="4 3"':""}/>`).join("");
  const keys=["L","S","R","W"],names={L:"Nghe",S:"Nói",R:"Đọc",W:"Viết"};
  const pts=keys.map((k,i)=>pt(i,Math.max(vals[k]||0,2)));
  const lab=keys.map((k,i)=>{const [x,y]=pt(i,124);return `<text x="${x}" y="${y+4}" text-anchor="middle" font-weight="700">${names[k]} ${vals[k]||0}</text>`}).join("");
  return `<svg class="radar" viewBox="0 0 300 270" role="img" aria-label="Biểu đồ bốn kỹ năng">${rings}${ax.map((_,k)=>{const [x,y]=pt(k,100);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}).join("")}
   <polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="color-mix(in srgb,var(--c) 30%,transparent)" stroke="var(--c)" stroke-width="2.5" stroke-linejoin="round"/>
   ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--c)"/>`).join("")}${lab}</svg>`;
}

   <div class="row" style="margin-bottom:10px"><input class="inp" id="bq" placeholder="Tìm tiếng Anh hoặc tiếng Việt" value="${esc(bookQ)}" style="flex:1;min-width:200px"><button class="btn primary" id="brev">Ôn nhanh 15 từ</button></div>
   <div class="filters">${[["all","Tất cả"],["un","Chưa thuộc"],["kn","Đã thuộc"],["core","Cốt lõi"],["ext","Mở rộng"]].map(([k,t])=>`<button class="fchip" aria-pressed="${bookF===k}" data-f="${k}">${t}</button>`).join("")}</div>

      all.forEach(x=>{tot++;if(isKnown(m,n,x.en))kn++});
      const list=all.filter(x=>{const k=isKnown(m,n,x.en);if(bookF==="un"&&k)return false;if(bookF==="kn"&&!k)return false;if(bookF==="core"&&!x.core)return false;if(bookF==="ext"&&x.core)return false;
        return !q||x.en.toLowerCase().includes(q)||x.vi.toLowerCase().includes(q)});

       <div class="vgrid">${list.map(x=>`<div class="vt ${isKnown(m,n,x.en)?"known":""}" data-n="${n}" data-en="${esc(x.en)}" role="button" tabindex="0"><span class="tag">${x.core?"cốt lõi":x.ai?"AI":"mở rộng"}</span><button class="ck" data-t="1" aria-label="Đánh dấu đã thuộc">${isKnown(m,n,x.en)?"✅":"⬜"}</button><span class="e">${em(x.em,58)}</span><span class="w en">${esc(x.en)}</span><span class="v">${esc(x.vi)}</span></div>`).join("")}</div></div>`}).join("")||'<p class="muted">Không có từ nào khớp bộ lọc.</p>';
    $("#bstat").innerHTML=ring(Math.round(kn/Math.max(1,tot)*100),kn,"big");
    bindGo($("#blist"));
    $$("#blist .vt").forEach(t=>{const f=()=>{const n=+t.dataset.n,x=words(m.weeks[n-1]).concat(aiWords(m,n)).find(y=>y.en===t.dataset.en);speak(x.en);toast(`${x.en}: ${x.vi}${x.ex?". "+clean(x.ex):""}`)};
      t.onclick=f;t.onkeydown=e=>{if(e.key==="Enter")f()};
      t.querySelector("[data-t]").onclick=e=>{e.stopPropagation();const n=+t.dataset.n;knownToggle(m,n,t.dataset.en,!isKnown(m,n,t.dataset.en));draw()}});
  };
  draw();
  $("#bq").oninput=e=>{bookQ=e.target.value;draw()};
  $$(".fchip").forEach(b=>b.onclick=()=>{bookF=b.dataset.f;$$(".fchip").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  $("#brev").onclick=()=>{
    const all=m.weeks.flatMap((w,i)=>words(w).map(x=>({x,n:i+1})));const un=all.filter(o=>!isKnown(m,o.n,o.x.en));

    const items=sel.map((o,i)=>Object.assign(i%2?qWord(o.x,pool):qMeaning(o.x,pool,true),{n:o.n}));

      (it,ok)=>{if(ok)knownToggle(m,it.n,it.word.en,true)});
  };
}

function wrapLabel(s,max){const ws=s.split(" ");const lines=[""];ws.forEach(x=>{const l=lines[lines.length-1];if((l+" "+x).trim().length>max&&l)lines.push(x);else lines[lines.length-1]=(l+" "+x).trim()});return lines.slice(0,3)}
function drawMap(m,n){

   ${pos.map(([X,Y])=>`<line x1="${cx}" y1="${cy}" x2="${X}" y2="${Y}" stroke="var(--c)" stroke-opacity=".35" stroke-width="2"/>`).join("")}
   <circle cx="${cx}" cy="${cy}" r="66" fill="var(--c)" filter="url(#sh)"/><circle cx="${cx}" cy="${cy}" r="66" fill="url(#cg)"/>
   ${emSvg(w.i,cx,cy-20,46)}
   ${title.map((l,j)=>`<text x="${cx}" y="${cy+20+j*15}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:#fff">${esc(l)}</text>`).join("")}
   ${w.w.map((x,i)=>{const [X,Y]=pos[i];const k=isKnown(m,n,x[0]);const lab=wrapLabel(x[0],15);
     return `<g class="node" tabindex="0" role="button" aria-label="${esc(x[0])}" data-i="${i}">
      <circle cx="${X}" cy="${Y}" r="30" fill="${k?"color-mix(in srgb,var(--c) 28%,var(--surface))":"var(--surface)"}" stroke="var(--c)" stroke-width="${k?3.5:2}" filter="url(#sh)"/>
      ${emSvg(x[2],X,Y,36)}
      ${lab.map((l,j)=>`<text x="${X}" y="${Y+47+j*14}" text-anchor="middle" font-size="12.5" font-weight="600">${esc(l)}</text>`).join("")}</g>`}).join("")}
  </svg><div class="detail" id="detail"><p class="small muted" style="margin:0">Bản đồ 8 từ cốt lõi. Chạm từng nhánh để nghe và xem nghĩa; nhánh tô đậm là từ đã thuộc. 12 từ mở rộng nằm ở thẻ Từ vựng.</p></div>`;
  $$("#map .node").forEach(g=>{const f=()=>showDetail(m,n,+g.dataset.i);g.onclick=f;g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
}

let aiAbort=null;
function runner(el,items,title,onDone,onItem){
  running=true;let i=0;const scores=[];
  const next=()=>{if(i>=items.length){running=false;onDone(Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100));return}draw()};
  const draw=()=>{const it=items[i];
    el.innerHTML=`<div class="prog"><i style="width:${i/items.length*100}%"></i></div><div class="item"><div class="ttl">${esc(title)}: câu ${i+1}/${items.length}</div><div id="it"></div>
     <div class="row hidden" id="nx" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" id="nxb">${i===items.length-1?"Xem kết quả":"Câu tiếp"}</button></div></div>`;
    const fin=v=>{scores[i]=v;if(onItem)onItem(it,v>=1);$("#nx").classList.remove("hidden");$("#nxb").focus({preventScroll:true})};
    $("#nxb").onclick=()=>{stopSpeak();i++;next()};
    ITEM[it.type]($("#it"),it,fin);
  };
  next();
}

  let best=-1,given=false;const give=v=>{if(!given){given=true;fin(v)}else{fin(v)}};
  el.innerHTML=`<div class="prompt en">${esc(clean(it.text))}</div><p class="small muted" style="margin:-6px 0 10px">Nghe mẫu, bấm micro và đọc theo. Thử nhiều lần, lấy lần tốt nhất.</p>
   <div class="row"><button class="icon" id="p1" aria-label="Nghe">${I.play}</button><button class="icon" id="p2" aria-label="Nghe chậm">${I.slow}</button><button class="icon" id="mic" aria-label="Nói">${I.mic}</button><span id="st" class="small muted"></span><button class="btn sm" id="selfb" style="margin-left:auto">Không dùng micro</button></div>
   <div class="res" id="r"></div><div id="self" class="hidden" style="margin-top:10px"><p class="small" style="margin:0 0 8px">Thiết bị chưa cho nhận giọng nói ở đây. Anh đọc to câu trên rồi tự đánh giá trung thực:</p>
   <div class="row"><button class="btn sm" data-v="90">Trôi chảy, rõ</button><button class="btn sm" data-v="70">Khá, còn vấp</button><button class="btn sm" data-v="45">Chưa đọc được</button></div></div>`;
  $("#p1").onclick=()=>speak(it.text);$("#p2").onclick=()=>speak(it.text,null,Math.max(.55,S.rate-.25));
  const selfMode=()=>{$("#self").classList.remove("hidden");$$("#self [data-v]").forEach(b=>b.onclick=()=>{$$("#self [data-v]").forEach(x=>{x.disabled=true;x.classList.toggle("primary",x===b)});give(+b.dataset.v/100)})};
  if(!SR)selfMode();
  $("#selfb").onclick=()=>{$("#selfb").classList.add("hidden");selfMode()};
  $("#mic").onclick=()=>{stopSpeak();$("#st").textContent="Đang nghe...";
    listen($("#mic"),t=>{const p=sim(t,it.text);best=Math.max(best,p);$("#st").textContent="";
      $("#r").innerHTML=`<span class="score ${p>=85?"ok":p>=60?"mid":"no"}">${p}%</span> khớp. Máy nghe được: <span class="en">${esc(t)}</span>${best>p?` (tốt nhất ${best}%)`:""}`;give(best/100)},
      msg=>{$("#st").textContent="";if(msg==="nosr")selfMode();else toast(msg)})};
 },
 order(el,it,fin){
  const toks=clean(it.text).split(/\s+/);let src=shuffle(toks.map((t,i)=>({t,i})));
  if(toks.length>2&&src.map(x=>x.t).join(" ")===toks.join(" "))src.reverse();
  let dst=[],locked=false;
  const draw=()=>{el.innerHTML=`<div class="prompt">🧩 Chạm các từ theo đúng thứ tự để tạo câu.</div><div class="chips en" id="dst" aria-label="Câu của anh">${dst.map((x,k)=>`<button data-d="${k}" ${locked?"disabled":""}>${esc(x.t)}</button>`).join("")||'<span class="small muted">Câu sẽ hiện ở đây</span>'}</div>
    <div class="chips src en">${src.map((x,k)=>`<button data-s="${k}" ${locked?"disabled":""}>${esc(x.t)}</button>`).join("")}</div>
    <div class="row"><button class="btn primary" id="chk" ${src.length||locked?"disabled":""}>Kiểm tra</button><button class="btn" id="clr" ${locked?"disabled":""}>Xếp lại</button></div><div class="res" id="r"></div>`;
    $$("[data-s]").forEach(b=>b.onclick=()=>{dst.push(src.splice(+b.dataset.s,1)[0]);draw()});
    $$("[data-d]").forEach(b=>b.onclick=()=>{src.push(dst.splice(+b.dataset.d,1)[0]);draw()});
    $("#clr").onclick=()=>{src=src.concat(dst);dst=[];draw()};
    $("#chk").onclick=()=>{const mine=dst.map(x=>x.t).join(" ");const ok=norm(mine).join(" ")===norm(toks.join(" ")).join(" ");
      const p=sim(mine,toks.join(" "));locked=true;draw();
      $("#r").innerHTML=ok?'<span class="score ok">Chính xác.</span>':`<span class="score no">Chưa đúng (${p}% khớp).</span> Câu đúng: <span class="en">${esc(toks.join(" "))}</span>`;
      speak(it.text);fin(ok?1:Math.max(0,(p-40)/100))}};
  draw();
 }
};
function doneScreen(el,score,label,again,nextHref,nextLabel){
  running=false;const b=band(score);
  el.innerHTML=`<div class="done box">${ring(score,score,"big")}<div style="font-weight:800;color:var(${b[2]});margin-top:8px">${b[1]}</div>
   <p class="muted">${esc(label)}${score>=70?"":" Cần từ 70 để đạt chuẩn; ôn lại rồi làm lần nữa."}</p>
   <div class="row" style="justify-content:center"><button class="btn" id="again">Làm lại</button>${nextHref?`<button class="btn primary" data-go="${nextHref}">${esc(nextLabel)}</button>`:""}</div></div>`;
  el.querySelector(".ring").style.margin="0 auto";
  $("#again").onclick=again;bindGo(el);
}

/* Listening */
function tabListen(m,n){
  const w=m.weeks[n-1],all=words(w);
  const sel=pick(all.filter(x=>x.core),3).concat(pick(all.filter(x=>!x.core),4));
  const ws=shuffle(sel).map(x=>qMeaning(x,all,true));
  const pool=sentPool(w);
  const dict=pick(byLen(pool,5,15).length>=3?byLen(pool,5,15):pool,3).map(t=>({type:"dict",text:t}));
  $("#panel").innerHTML=`<p class="small muted" style="margin:0 0 12px">7 câu nghe từ, chọn nghĩa (cốt lõi và mở rộng) và 3 câu chép chính tả. Mỗi lần làm lại, câu hỏi được trộn mới.</p><div id="run"></div>`;
  runner($("#run"),ws.concat(dict),"Nghe",sc=>{setSc(m,n,"L",sc);doneScreen($("#run"),sc,"Điểm Nghe đã lưu (giữ điểm cao nhất).",()=>tabListen(m,n),`#/${m.id}/${n}/R`,"Sang Đọc")});
}

   <div class="passage en">${markUp(w.p,cw)}</div><div class="tip hidden" id="tip"></div></div>
   <p class="small muted">Chạm từ được tô để xem nghĩa. Đọc xong làm 7 câu: đúng/sai, điền từ cốt lõi và từ mở rộng.</p><div id="run"><button class="btn primary" id="startq">Làm câu hỏi đọc hiểu</button></div>`;
  $("#ra").onclick=()=>speak(w.p);$("#rs").onclick=stopSpeak;
  $$(".passage mark").forEach(mk=>mk.onclick=()=>{const x=all.find(y=>y.en.toLowerCase()===mk.dataset.w.toLowerCase());if(!x)return;

    const ce=shuffle(all.filter(x=>!x.core)).map(x=>qCloze(x,all)).filter(Boolean).slice(0,2);
    runner($("#run"),shuffle(tf).concat(cz,ce),"Đọc",sc=>{setSc(m,n,"R",sc);doneScreen($("#run"),sc,"Điểm Đọc đã lưu.",()=>tabRead(m,n),`#/${m.id}/${n}/S`,"Sang Nói")});
  };

/* Speaking */
function tabSpeak(m,n){
  const w=m.weeks[n-1];
  const ps=sentences(w.p).filter(balanced).map(clean);
  const items=pick(byLen(ps,4,20),3).concat(pick(w.v.map(x=>x[3]),3)).map(t=>({type:"shadow",text:t}));
  $("#panel").innerHTML=`<p class="small muted" style="margin:0 0 12px">Phần 1 tính điểm: đọc nhại 6 câu (shadowing) từ bài đọc và từ mở rộng. Phần 2 tùy chọn: trò chuyện với AI về chủ đề tuần.</p><div id="run"></div><div class="sec" id="free"></div>`;
  runner($("#run"),items,"Nói",sc=>{setSc(m,n,"S",sc);doneScreen($("#run"),sc,"Điểm Nói đã lưu.",()=>tabSpeak(m,n),`#/${m.id}/${n}/W`,"Sang Viết")});
  freeTalk(m,n);
}
function freeTalk(m,n){
  const w=m.weeks[n-1],box=$("#free");
  if(!sampleFn){box.innerHTML=`<h3>💬 Trò chuyện với AI</h3><p class="small muted">Phần này cần mở trang trong Claude. Tạm thời anh có thể tự trả lời thành tiếng: <span class="en">“Can you tell me about ${esc(w.e.toLowerCase())} in your life or work?”</span></p>`;return}
  const st={log:[],busy:false};
  const draw=()=>{box.innerHTML=`<h3>💬 Trò chuyện với AI</h3><p class="small muted" style="margin:0">AI đóng vai ${m.id==="m1"?"người bản xứ trong đời sống":m.id==="m2"?"khách hàng hoặc đồng nghiệp ngành tài chính":"giảng viên, đồng nghiệp nghiên cứu"}; sau mỗi lượt có góp ý câu tự nhiên hơn.</p>
    <div class="chat">${st.log.map(x=>x.who==="ai"?`<div class="msg ai en">${esc(x.t)}</div>`:x.who==="me"?`<div class="msg me en">${esc(x.t)}</div>`:`<div class="fb">${x.good?"<b>Ổn.</b> ":"<b>Nên nói:</b> "}<span class="en">${esc(x.better)}</span>${x.note?"<br>"+esc(x.note):""}</div>`).join("")}${st.busy?'<div class="thinking">AI đang trả lời...</div>':""}</div>
    ${st.log.length?`<div class="composer"><button class="icon" id="fm" aria-label="Nói">${I.mic}</button><textarea id="fi" class="en" lang="en" placeholder="Nói hoặc gõ câu trả lời bằng tiếng Anh" ${st.busy?"disabled":""}></textarea><button class="btn primary" id="fs" ${st.busy?"disabled":""}>Gửi</button></div>`:`<button class="btn primary" id="go1" ${st.busy?"disabled":""}>Bắt đầu trò chuyện</button>`}`;
    if($("#go1"))$("#go1").onclick=()=>call(null);
    if($("#fs")){$("#fs").onclick=()=>{const t=$("#fi").value.trim();if(t)call(t)};$("#fi").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#fs").click()}};
      $("#fm").onclick=()=>listen($("#fm"),t=>{$("#fi").value=t},msg=>toast(msg==="nosr"?"Thiết bị chưa cho nhận giọng nói ở đây, anh gõ câu trả lời nhé.":msg))}};
  const call=async t=>{if(st.busy)return;if(t)st.log.push({who:"me",t});st.busy=true;draw();
    const tr=st.log.filter(x=>x.who!=="fb").map(x=>(x.who==="ai"?"PARTNER: ":"LEARNER: ")+x.t).join("\n");
    const prompt=`You are an English speaking partner for a Vietnamese adult professional. Role: ${m.persona}. Topic: "${w.e}". Target level: ${m.months[Math.ceil(n/4)-1].lv} (CEFR). Encourage these words: ${words(w).map(x=>x.en).join(", ")}.
Keep each reply to 1-3 short natural sentences and end with one question. Do not invent precise legal figures or statistics.
${t?"Conversation so far:\n"+tr+"\nAlso evaluate ONLY the learner's last message.":"Start the conversation with a friendly opening question on the topic."}
Return ONLY JSON: {"reply":"...","good":${t?"true or false":"true"},"better":"${t?"a more natural corrected version of the learner's last message":""}","note_vi":"${t?"one short explanation in Vietnamese, max 25 words, or empty":""}"}`;
    aiAbort=new AbortController();
    try{const o=await sampleFn.json(prompt,{modelTier:"quick",cache:false,signal:aiAbort.signal});
      if(t)st.log.push({who:"fb",good:!!o.good,better:o.better||t,note:o.note_vi||""});st.log.push({who:"ai",t:o.reply||"Could you say that again?"});if(o.reply)speak(o.reply);touch();save()}
    catch(e){if(t)st.log.pop();if(!(e&&e.code==="cancelled"))toast(e&&e.code==="not_granted"?"Anh chưa cho phép trang dùng Claude.":"AI chưa trả lời được, anh gửi lại sau.")}
    finally{st.busy=false;aiAbort=null;if(document.body.contains(box))draw()}};
  draw();
}
/* Writing */
function tabWrite(m,n){
  const w=m.weeks[n-1],pool=sentPool(w);
  const items=pick(byLen(pool,5,12).length>=3?byLen(pool,5,12):pool,3).map(t=>({type:"order",text:t}));
  $("#panel").innerHTML=`<p class="small muted" style="margin:0 0 12px">Phần 1: sắp xếp 3 câu (40% điểm). Phần 2: viết đoạn theo đề (60% điểm).</p><div id="run"></div>`;
  runner($("#run"),items,"Viết, phần 1",a=>{running=true;freeWrite(m,n,a)});
}
function freeWrite(m,n,a){
  const w=m.weeks[n-1],all=words(w),el=$("#run");
  el.innerHTML=`<div class="item"><div class="ttl">Viết, phần 2 (phần 1 đạt ${a})</div><div class="prompt">✍️ ${esc(w.x)}</div>
   <p class="small muted" style="margin:-6px 0 8px">Dùng ít nhất 4 từ của tuần (cốt lõi hoặc mở rộng). ${sampleFn?"AI chấm theo 4 tiêu chí: hoàn thành đề, ngữ pháp, từ vựng, mạch lạc.":"Bản ngoại tuyến chấm theo số từ của tuần và độ dài; mở trong Claude để AI chấm chi tiết."}</p>
   <textarea id="wt" class="en" lang="en" style="min-height:160px" placeholder="Viết bằng tiếng Anh..."></textarea>
   <div class="small used" id="used" style="margin:8px 0"></div>
   <div class="row"><button class="btn primary" id="sub">Nộp bài</button></div><div class="res" id="r"></div></div>`;
  const usedOf=t=>all.filter(x=>wre(x.en).test(t));
  const upd=()=>{const t=$("#wt").value;const u=usedOf(t);const len=t.trim()?t.trim().split(/\s+/).length:0;
    $("#used").innerHTML=`Đã dùng ${u.length} từ của tuần${u.length?": "+u.map(x=>`<mark>${esc(x.en)}</mark>`).join(", "):""}. Số từ: ${len}. <span class="muted">Gợi ý: ${pick(all.filter(x=>!u.includes(x)),5).map(x=>esc(x.en)).join(", ")}</span>`};
  $("#wt").oninput=upd;upd();
  $("#sub").onclick=async()=>{const t=$("#wt").value.trim();const len=t?t.split(/\s+/).length:0;if(len<15){toast("Anh viết ít nhất khoảng 15 từ nhé.");return}
    const u=usedOf(t).length;
    const offline=Math.round(Math.min(u,4)/4*60+Math.min(len,60)/60*40);
    const fin=(b,html)=>{const sc=Math.round(a*.4+b*.6);setSc(m,n,"W",sc);running=false;
      $("#r").innerHTML=html+`<p><b>Điểm Viết tuần: ${sc}</b> (phần 1: ${a}, phần 2: ${b}).</p><div class="row"><button class="btn" id="wa">Làm lại</button>${n<12?`<button class="btn primary" data-go="#/${m.id}/${n+1}">Sang tuần ${n+1}</button>`:`<button class="btn primary" data-go="#/${m.id}/ck/3">Kiểm tra mốc tháng 3</button>`}</div>`;
      $("#wa").onclick=()=>tabWrite(m,n);bindGo($("#r"));$("#sub").disabled=true;$("#wt").readOnly=true};
    if(!sampleFn){fin(offline,`<p class="small muted">Chấm ngoại tuyến: dùng ${u} từ của tuần, ${len} từ.</p>`);return}
    $("#sub").disabled=true;$("#r").innerHTML='<p class="thinking">AI đang chấm bài, thường mất 10–40 giây...</p>';
    aiAbort=new AbortController();
    try{const o=await sampleFn.json(`You are an experienced English writing examiner for Vietnamese adult learners. Module: ${m.en}. Target level: ${m.months[Math.ceil(n/4)-1].lv} (CEFR).
Task (in Vietnamese): ${w.x}
Useful words of the week: ${all.map(x=>x.en).join(", ")}
Learner's text:
"""${t}"""
Score 0-100 relative to the target level using four equal criteria: task achievement, grammar accuracy, vocabulary range (including words of the week), coherence. Be fair and specific; do not inflate.
Return ONLY JSON: {"score":number,"criteria":{"task":0-25,"grammar":0-25,"vocabulary":0-25,"coherence":0-25},"corrected":"the learner's text rewritten correctly and naturally, keeping their ideas","good_vi":"one sentence in Vietnamese on what was done well","fixes_vi":["up to 4 short, specific corrections explained in Vietnamese, each quoting the wrong phrase and the fix"]}`,{modelTier:"default",signal:aiAbort.signal});
      const b=Math.max(0,Math.min(100,Math.round(+o.score||offline)));const c=o.criteria||{};
      fin(b,`<div class="box" style="margin-top:6px"><p style="margin-top:0"><b>AI chấm phần 2: ${b}/100</b><br><span class="small muted">Hoàn thành đề ${c.task??"–"}/25, ngữ pháp ${c.grammar??"–"}/25, từ vựng ${c.vocabulary??"–"}/25, mạch lạc ${c.coherence??"–"}/25</span></p>
        ${o.good_vi?`<p>👍 ${esc(o.good_vi)}</p>`:""}${(o.fixes_vi||[]).length?`<ul>${o.fixes_vi.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
        ${o.corrected?`<p class="small muted" style="margin-bottom:4px">Bản viết lại:</p><p class="en">${esc(o.corrected)}</p><button class="btn sm" id="hc">Nghe bản viết lại</button>`:""}</div>`);
      if($("#hc"))$("#hc").onclick=()=>speak(o.corrected)}
    catch(e){if(e&&e.code==="cancelled")return;fin(offline,`<p class="small muted">AI chưa chấm được (${e&&e.code==="not_granted"?"chưa cấp quyền":"lỗi kết nối"}), dùng điểm ngoại tuyến: ${u} từ của tuần, ${len} từ.</p>`)}
    finally{aiAbort=null}};
}

/* ---------- Checkpoint ---------- */
function renderCheckpoint(m,mo){
  const all=[0,1,2,3].flatMap(j=>words(m.weeks[(mo-1)*4+j]));
  const sel=pick(all.filter(x=>x.core),8).concat(pick(all.filter(x=>!x.core),7));
  const items=shuffle(sel).map((x,i)=>i%3===0?qMeaning(x,all,true):i%3===1?qWord(x,all):(qCloze(x,all)||qWord(x,all)));
  mount(`<button class="back" data-go="#/${m.id}">‹ ${esc(m.name)}</button>
   <div class="wband"><div class="em">${em("🏁",76)}</div><div class="info"><h1>Kiểm tra mốc tháng ${mo}</h1><div class="muted small">${esc(m.months[mo-1].name)}, mục tiêu ${esc(m.months[mo-1].lv)}. 15 câu trộn từ 80 từ của 4 tuần; đạt từ 70% là qua mốc.</div></div></div>
   <div id="panel"><div id="run"></div></div>`);
  runner($("#run"),items,"Kiểm tra",sc=>{const k=m.id+"-"+mo;S.ck[k]=Math.max(S.ck[k]||0,sc);touch();save();
    doneScreen($("#run"),sc,sc>=70?`Đạt mốc ${m.months[mo-1].lv}.`:"Chưa đạt mốc.",()=>renderCheckpoint(m,mo),`#/${m.id}`,"Về lộ trình")});
}

function kFinish(G,acc){const k=KS();let st=acc>=.9?3:acc>=.7?2:acc>=.4?1:0;if(G.li===4)st=G.hearts>0?G.hearts:0;
  const key=G.wi+"-"+G.li,pr=k.prog[G.p.id]||(k.prog[G.p.id]={}),before=pr[key]||0;pr[key]=Math.max(before,st);
